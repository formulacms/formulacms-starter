packages: []

overrides:
  kysely: "0.28.17"
  eslint-import-resolver-typescript: "3.10.0"
  # DEP-09: pin the currently patched advisory floors for transitive paths.
  # Keep these centralized so generated starters inherit the same security floor.
  # Security floors use major-bounded range selectors (`pkg@>=M.0.0 <floor`), never global exact pins, so parent upgrades keep their own ranges (2026-11-06).
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  "hono@>=4.0.0 <4.13.16": "4.13.16"
  "nanoid@>=3.0.0 <3.3.18": "3.3.18"
  "postcss@>=8.0.0 <8.5.23": "8.5.23"
  "semver@>=6.0.0 <6.3.1": "6.3.1"
  "ws@>=8.0.0 <8.21.0": "8.21.0"
  "proxy-addr@>=2.0.0 <2.0.8": "2.0.8"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "undici@>=7.0.0 <7.30.1": "7.30.1"
  "body-parser@>=2.0.0 <2.4.0": "2.4.0"
  "happy-dom@>=17.0.0 <21.0.4": "21.0.4"
  "brace-expansion@>=1.0.0 <1.1.21": "1.1.21"
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
  "postcss-selector-parser@>=6.0.0 <6.1.5": "6.1.5"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "systeminformation@>=5.0.0 <5.33.16": "5.33.16"

audit:
  ignore:
    # Dev-only (eslint/typescript-eslint, ts-morph via shadcn CLI, scripts/check-token-boundary.ts); `pnpm why -P` shows no production path; only fix is a major (minimatch 11 / glob 14). Decision 2026-11-06; remove in the majors unit (eslint 10 et al.)
    - GHSA-g3hv-75wg-m249
    # Dev-only (eslint/typescript-eslint, ts-morph via shadcn CLI, scripts/check-token-boundary.ts); `pnpm why -P` shows no production path; only fix is a major (minimatch 11 / glob 14). Decision 2026-11-06; remove in the majors unit (eslint 10 et al.)
    - GHSA-3g3m-2fjr-6pw4

# Reject any package update whose supply-chain trust signals (provenance,
# signatures) are weaker than an earlier published version. Guards against a
# compromised maintainer pushing a release that quietly drops attestation.
trustPolicy: no-downgrade
trustPolicyExclude:
  # Security patch for GHSA-c2qf-rxjj-qqgw; semver 6.3.1 lacks the newer
  # trust evidence required by no-downgrade, so keep the exception versioned.
  - semver@6.3.1

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true
  unrs-resolver: true
minimumReleaseAge: 1440
